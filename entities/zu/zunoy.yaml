              - criterion_id: cri_03
                kind: manual
                reason: external-verification
                statement: The applicant is a verified non-profit or NGO with an annual operating budget under $500,000.
          - criterion_id: cri_04
            fact: company.employee_count
            kind: predicate
            operator: lt
